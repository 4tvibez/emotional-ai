<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotional AI Lab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
<header>
<div>
<span class="eyebrow">4TVIBEZ • AI LAB</span>
<h1>Emotional AI</h1>
<p>A conversational agent with a simulated emotional state.</p>
</div>
<button id="reset">Reset mind</button>
</header>
<main>
<div class="avatar-stage" id="avatar-stage">
  <div class="avatar-glow"></div>
  <div class="avatar" id="nova-avatar" aria-label="Animated Nova avatar">
    <div class="avatar-hair"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="avatar-head">
      <div class="forehead-light"></div>
      <div class="brow brow-left"></div><div class="brow brow-right"></div>
      <div class="eye eye-left"><span class="iris"><i></i></span><span class="lid"></span></div>
      <div class="eye eye-right"><span class="iris"><i></i></span><span class="lid"></span></div>
      <div class="nose"></div>
      <div class="cheek cheek-left"></div><div class="cheek cheek-right"></div>
      <div class="mouth"><span></span></div>
      <div class="chin-light"></div>
    </div>
    <div class="neck"></div>
    <div class="shoulders"><span></span><span></span></div>
  </div>
  <div class="avatar-status"><span class="status-dot"></span><span id="avatar-status-text">Idle</span></div>
  <div class="voice-bars" id="voice-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>\n<section class="chat-card">
<div id="messages" class="messages">
<div class="message assistant"><strong>Nova</strong><p>Hello. I’m ready. My emotions are simulated software state, and you can inspect them while we talk.</p></div>
</div>
<form id="chat-form">
<input id="message" autocomplete="off" placeholder="Talk to Nova..." maxlength="2000">
<button>Send</button>
</form>
</section>
<aside class="dashboard">
<h2>Internal state</h2>
<div id="dominant" class="dominant">happiness</div>
<div id="emotions"></div>
<h2>Permissions</h2>
<div id="permissions"></div>
<h2>Memory</h2>
<div id="memory" class="memory"></div>
</aside>
</main>
</div>
<script src="/avatar.js"></script>\n<script src="/app.js"></script>
</body>
</html>
